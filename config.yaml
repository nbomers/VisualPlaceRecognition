# Projektparameter, versioniert. Umgebungsvariablen (VPR_CITY, VPR_METHOD,
# VPR_ADAPTER, ...) stechen einzelne Werte, ohne die Datei zu aendern.

# Bestimmt auch die Ablage: data/<slug>, results/<slug>, ... (src/paths.py).
city: "Osnabrück, Germany"


# YAML-Anker fuer die PCA-Varianten unter vpr; kein eigener Schalter.
_vorlagen:
  pca512:  &pca512  {pca_dim: 512, fit_images: 50000, whiten: false}
  pcaw512: &pcaw512 {pca_dim: 512, fit_images: 50000, whiten: true}


# ============================================================
# VPR
# ============================================================

vpr:

  # ----------------------------------------------------------
  # Verfahren
  # ----------------------------------------------------------

  # Ein Name aus vpr.models. run.py --method sticht ihn je Lauf.
  method: "eigenplaces"

  # none = Encoder wie veroeffentlicht, linear = mit Adapter aus 05.
  adapter: "none"

  models:
    # Nur Namen; die Konfiguration steht in eigenen Bloecken darunter.
    clip: "openai/clip-vit-base-patch32"
    anyloc: "dinov2_vitg14"
    mixvpr: "resnet50"
    eigenplaces: "ResNet50"
    megaloc: "megaloc"

    # Auf 512 reduziert (experiments/pca_reduce.py), danach normale Encoder.
    clip_pca512: "clip -> PCA 512"
    anyloc_pca512: "anyloc -> PCA 512"
    mixvpr_pca512: "mixvpr -> PCA 512"
    eigenplaces_pca512: "eigenplaces -> PCA 512"
    megaloc_pca512: "megaloc -> PCA 512"

    # Dieselben, zusaetzlich gewhitent: jede Hauptrichtung auf gleiche Streuung.
    clip_pcaw512: "clip -> PCA 512 + Whitening"
    anyloc_pcaw512: "anyloc -> PCA 512 + Whitening"
    mixvpr_pcaw512: "mixvpr -> PCA 512 + Whitening"
    eigenplaces_pcaw512: "eigenplaces -> PCA 512 + Whitening"
    megaloc_pcaw512: "megaloc -> PCA 512 + Whitening"

    # Nur Whitening, volle Breite: trennt den Effekt des Whitenings von dem
    # der Breite. EigenPlaces ist die Kontrolle an einem VPR-Encoder.
    anyloc_pcaw4096: "anyloc -> Whitening auf 4096"
    eigenplaces_pcaw2048: "eigenplaces -> Whitening auf 2048"

    # Verkettung, 1024 Dimensionen (experiments/concat_embeddings.py).
    eigenplaces_megaloc_concat: "eigenplaces_pcaw512 + megaloc_pcaw512"


  clip:
    revision: "3d74acf9a28c67741b2f4f2ea7635f0aaf6f0268"

  anyloc:
    # ViT-G passt auf 8 GB VRAM nur in kleinen Batches; sticht embed_batch_size.
    batch_size: 4

    repo_path: "external/AnyLoc"
    vocabulary_domain: "urban"        # urban | indoor | aerial
    desc_layer: 31
    desc_facet: "value"
    num_clusters: 32
    image_size: 322                   # 23 * 14
    pca_dim: 4096                     # null = keine Reduktion
    pca_fit_images: 10000

  mixvpr:
    repo_path: "external/MixVPR"
    weights: "weights/mixvpr/resnet50_MixVPR_4096_channels(1024)_rows(4).ckpt"
    image_size: 320
    agg_config:
      in_channels: 1024
      in_h: 20
      in_w: 20
      out_channels: 1024
      mix_depth: 4
      mlp_ratio: 1
      out_rows: 4

  eigenplaces:
    fc_output_dim: 2048          # 128 | 256 | 512 | 2048
    image_size: 512


  # ----------------------------------------------------------
  # PCA-Varianten
  # ----------------------------------------------------------

  # source = Encoder, aus dem reduziert wird. Die PCA wird nur auf train
  # angepasst; alle Werte gehen in den Fingerabdruck ein. <<: fuegt die
  # Vorlage vom Dateianfang ein.
  #
  # Whitening bewusst meist auf 512 Komponenten: die kleinsten Eigenwerte
  # sind Rauschen, und Whitening teilt durch sie. Die beiden Varianten auf
  # voller Breite passen zu dieser Vermutung, belegen sie aber nicht.

  clip_pca512:        {source: "clip",        <<: *pca512}
  anyloc_pca512:      {source: "anyloc",      <<: *pca512}
  mixvpr_pca512:      {source: "mixvpr",      <<: *pca512}
  eigenplaces_pca512: {source: "eigenplaces", <<: *pca512}
  megaloc_pca512:     {source: "megaloc",     <<: *pca512}

  clip_pcaw512:        {source: "clip",        <<: *pcaw512}
  anyloc_pcaw512:      {source: "anyloc",      <<: *pcaw512}
  mixvpr_pcaw512:      {source: "mixvpr",      <<: *pcaw512}
  eigenplaces_pcaw512: {source: "eigenplaces", <<: *pcaw512}
  megaloc_pcaw512:     {source: "megaloc",     <<: *pcaw512}

  anyloc_pcaw4096:      {source: "anyloc",      pca_dim: 4096, fit_images: 50000, whiten: true}
  eigenplaces_pcaw2048: {source: "eigenplaces", pca_dim: 2048, fit_images: 50000, whiten: true}

  # Quellen werden ueber die image_id ausgerichtet; die Reihenfolge hier ist
  # die Reihenfolge der Bloecke im verketteten Vektor.
  eigenplaces_megaloc_concat:
    sources: ["eigenplaces_pcaw512", "megaloc_pcaw512"]


  # ----------------------------------------------------------
  # Dataset Split
  # ----------------------------------------------------------

  split_seed: 42

  train_fraction: 0.70
  database_fraction: 0.15
  query_fraction: 0.15

  # Anteil der train-Sequenzen, den 05 als Validierung zurueckhaelt.
  val_fraction: 0.10


  # ----------------------------------------------------------
  # Geografische Definition
  # ----------------------------------------------------------

  # Positiv-Paar im Adaptertraining (05): zwei train-Bilder aus
  # verschiedenen Sequenzen, hoechstens so weit auseinander.
  positive_radius_m: 10.0

  # Schwelle der Ground Truth (auch Standard von compare.py --threshold) und
  # Grenze der Negative in 05; dazwischen liegt die unsichere Zone. Warum
  # 25 m: ueber dem GPS-Rauschen (5-15 m), unter der Blocklaenge -- README,
  # "Warum 25 Meter". 07 berichtet zusaetzlich 5 / 10 / 50 / 100 m.
  uncertain_radius_m: 25.0

  # Hard Negatives fuer 05. Muessen oberhalb der unsicheren Zone liegen,
  # sonst trainiert man gegen die eigene Metrik.
  hard_negative_min_m: 25.0
  hard_negative_max_m: 100.0

  # Hoechste Kompassabweichung fuer ein Positiv-Paar und fuer die
  # Blickrichtungs-Auswertung in 07.
  max_heading_diff_deg: 90.0


  # ----------------------------------------------------------
  # Adapter Training
  # ----------------------------------------------------------

  # Ground-Truth-Radius der val-Metrik in 05; gleich uncertain_radius_m,
  # damit val und 07 dasselbe messen.
  val_radius_m: 25.0

  # Batchgroesse beim Encodieren in 04; aendert nur Tempo und Speicher.
  embed_batch_size: 64

  # Nur zum Ausprobieren: hoechstens so viele Bilder in 04. null = alle.
  max_images: null


  adapter_training:

    batch_size: 64                    # Triplets je Batch
    epochs: 20                        # hoechstens
    learning_rate: 0.001
    margin: 0.2                       # auf dem Cosinus-Abstand 1 - cos
    hard_negative_probability: 0.75   # sonst ein Easy Negative

    # Abbruch nach so vielen Epochen ohne Verbesserung von val Recall@1
    # (null = alle). Gespeichert wird ohnehin die beste Epoche.
    patience: 3

    # Mindestzuwachs, der als Verbesserung zaehlt; ein einzelner Treffer
    # unter ~3.200 val-Queries sind 0.0003.
    min_delta: 0.001

    # Obergrenze fuer Trainingspaare je Epoche (null = alle).
    max_pairs_per_epoch: null


# ============================================================
# Retrieval
# ============================================================

retrieval:

  # faiss | numpy
  method: "faiss"

  # Treffer je Anfrage, die 06 speichert; begrenzt k in 07 und 08.
  top_k: 50

  # Schwellen der Ground Truth in 07, in Metern.
  thresholds: [5, 10, 25, 50, 100]

  # Recall@k fuer diese k (<= top_k).
  k_values: [1, 5, 10, 20]

  # "Hard": ein Treffer zaehlt nur von einem anderen Fotografen oder mit
  # mindestens so vielen Tagen Abstand.
  min_days_apart: 180


# ============================================================
# Lokalisierung
# ============================================================

# 08 nimmt die Koordinate des besten Treffers. Die Werte unten gelten fuer
# die Aggregationsverfahren in experiments/localization_aggregation.py --
# gemessen, alle schlechter als Top-1.
localization:

  # Treffer, die aggregiert werden (<= retrieval.top_k).
  top_k: 10

  # DBSCAN: Radius wie die Ground Truth, Mindestgroesse einer Gruppe.
  eps_m: 25.0
  min_samples: 2

  # Gated: Top-1 wird nur ersetzt, wenn mindestens dieser Anteil der Treffer
  # in der staerksten Gruppe liegt.
  gate_share: 0.7

  # Gewicht je Treffer = exp(T * (cos - cos_max)). Cosinus-Werte liegen dicht
  # beieinander; ohne Spreizung waere es ein ungewichteter Mittelwert.
  # Grosses T naehert sich Top-1.
  softmax_temperature: 50.0


# ============================================================
# Mapillary
# ============================================================

zoom: 14

# Kacheln (01) rechnen auf der CPU, der Download (03) wartet auf das Netz.
tile_workers: "auto"        # min(16, 2 x CPU-Kerne)
download_workers: "auto"    # 96

# Breite der geladenen Thumbnails; die Modelle skalieren selbst herunter.
download_image_size: 1024

# Anteil fehlender Bilder, ab dem 03 und 04 abbrechen. Ohne Schranke gaelte
# ein durch abgelaufenen Token abgebrochener Download als fertig, und 04
# lieferte einen unvollstaendigen Encoder mit passendem Fingerabdruck.
# Osnabrueck: 1 Bild von 332.868 fehlt, bei MegaLoc 3.
max_missing_images_frac: 0.01

# 03 prueft die JPGs: false = nur die neu geladenen, true = alle (Minuten).
verify_all_images: false

# Bilder liegen ausserhalb des Repos (50 GB je Stadt): image_root/<slug>,
# daneben image_root/test fuer eigene Fotos. Je Rechner per VPR_IMAGE_ROOT
# oder VPR_IMAGE_PATH (Stadtordner direkt).
image_root: "~/Downloads/mapillary"


# ============================================================
# OpenStreetMap / Overpass
# ============================================================

# Stadtgrenze, Strassennetz und Stadtteile fuer 01. Nominatim und Overpass
# sind geteilte Dienste; Zeitueberschreitungen sind dort normal. 01 bricht
# daran nicht ab: der Datensatz steht vorher fest, Karten und Stadtteile
# fallen im Zweifel aus. Antworten landen gitignored unter cache/.

osm:

  # Endpunkt ohne /interpreter; je Rechner per VPR_OVERPASS_URL. Spiegel:
  #   https://overpass.kumi.systems/api
  #   https://overpass.private.coffee/api
  overpass_url: "https://overpass-api.de/api"

  # Sekunden je Abfrage (osmnx-Standard 180 reicht fuer eine ganze Stadt oft nicht).
  timeout_s: 300

  # Vor jeder Abfrage auf einen freien Slot warten -- langsamer, aber ohne
  # 429-Sperren mitten im Lauf.
  rate_limit: true


# ============================================================
# Stadtteil-Auswertung
# ============================================================

districts:

  # false = 01 berechnet keine Stadtteile (recall_by_district.py und
  # confusion_atlas.py laden sie trotzdem).
  enabled: true

  # Administrative Ebenen; bei Gleichstand gewinnt die zuerst genannte.
  admin_levels: [10, 9]

  # Rueckfall ohne brauchbare admin_level-Ebene: diese place-Tags.
  place_tags: [suburb, quarter, neighbourhood]

  # Kleinere Flaechen fallen weg; eine Ebene braucht mindestens so viele Teile.
  min_area_km2: 0.05
  min_districts_required: 3
