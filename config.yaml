# Projektparameter — bewusst versioniert.

# Die Stadt bestimmt auch die Ablage: data/<slug>, results/<slug>,
# experiments/results/<slug>, weights/adapter/<slug> (src/paths.py).
city: "Osnabrück, Germany"


# Vorlagen fuer die abgeleiteten Encoder unter vpr (YAML-Anker). Kein
# Schalter -- wer eine Variante aendern will, aendert ihren Block dort.
_vorlagen:
  pca512:  &pca512  {pca_dim: 512, fit_images: 50000, whiten: false}
  pcaw512: &pcaw512 {pca_dim: 512, fit_images: 50000, whiten: true}


# ============================================================
# VPR
# ============================================================

vpr:

  # ----------------------------------------------------------
  # Verfahren
  # ----------------------------------------------------------

  # Welcher Encoder: ein Name aus vpr.models -- die fuenf echten (clip,
  # anyloc, mixvpr, eigenplaces, megaloc) oder eine abgeleitete Variante.
  # run.py --method ueberschreibt das je Lauf.

  method: "eigenplaces"

  # none = Encoder wie veroeffentlicht, linear = mit dem in 05 trainierten
  # Adapter. Bestimmt, welche Embeddings 06 bis 08 auswerten.

  adapter: "none"

  models:
    # Nur Modellnamen. Die Konfiguration steht in eigenen Bloecken darunter.
    clip: "openai/clip-vit-base-patch32"
    anyloc: "dinov2_vitg14"
    mixvpr: "resnet50"
    eigenplaces: "ResNet50"
    megaloc: "megaloc"

    # Auf gemeinsame Deskriptorbreite reduzierte Varianten. Erzeugt von
    # experiments/pca_reduce.py, danach ganz normale Encoder fuer 05 bis 08.
    clip_pca512: "clip -> PCA 512"
    anyloc_pca512: "anyloc -> PCA 512"
    mixvpr_pca512: "mixvpr -> PCA 512"
    eigenplaces_pca512: "eigenplaces -> PCA 512"
    megaloc_pca512: "megaloc -> PCA 512"

    # Dieselben, zusaetzlich gewhitent: jede Hauptrichtung auf gleiche
    # Streuung gebracht. Eine lineare Nachbearbeitung wie der Adapter, nur
    # aus der Kovarianz geschaetzt statt aus Triplets gelernt.
    clip_pcaw512: "clip -> PCA 512 + Whitening"
    anyloc_pcaw512: "anyloc -> PCA 512 + Whitening"
    mixvpr_pcaw512: "mixvpr -> PCA 512 + Whitening"
    eigenplaces_pcaw512: "eigenplaces -> PCA 512 + Whitening"
    megaloc_pcaw512: "megaloc -> PCA 512 + Whitening"

    # Nur Whitening, keine Reduktion: trennt bei AnyLoc den Effekt des
    # Whitenings von dem der Breite. VLAD-Deskriptoren sind stark anisotrop;
    # ohne Whitening dominieren wenige Richtungen die Cosinus-Aehnlichkeit.
    anyloc_pcaw4096: "anyloc -> Whitening auf 4096"
    # Kontrolle dazu: derselbe Test an einem VPR-trainierten Encoder. Hilft
    # Whitening hier NICHT und bei AnyLoc schon, ist es ein VLAD-Befund.
    eigenplaces_pcaw2048: "eigenplaces -> Whitening auf 2048"

    # Verkettung der beiden besten gewhitenten Deskriptoren, 1024 Dimensionen.
    # Erzeugt von experiments/concat_embeddings.py.
    eigenplaces_megaloc_concat: "eigenplaces_pcaw512 + megaloc_pcaw512"


  clip:
    revision: "3d74acf9a28c67741b2f4f2ea7635f0aaf6f0268"

  anyloc:
    # ViT-G mit 1,14 Mrd. Parametern passt auf 8 GB VRAM nur in kleinen
    # Batches. Sticht vpr.embed_batch_size fuer dieses Verfahren.
    batch_size: 4

    repo_path: "external/AnyLoc"
    vocabulary_domain: "urban"        # urban | indoor | aerial
    desc_layer: 31
    desc_facet: "value"
    num_clusters: 32
    image_size: 322                   # 23 * 14
    pca_dim: 4096                     # null = keine Reduktion
    pca_fit_images: 10000

  mixvpr: 
    repo_path: "external/MixVPR"
    weights: "weights/mixvpr/resnet50_MixVPR_4096_channels(1024)_rows(4).ckpt"
    image_size: 320
    agg_config:
      in_channels: 1024
      in_h: 20
      in_w: 20
      out_channels: 1024
      mix_depth: 4
      mlp_ratio: 1
      out_rows: 4

  eigenplaces:
    fc_output_dim: 2048          # 128 | 256 | 512 | 2048
    image_size: 512


  # ----------------------------------------------------------
  # PCA-Varianten
  # ----------------------------------------------------------

  # Gemeinsame Deskriptorbreite fuer den fairen Vergleich. source nennt den
  # Encoder, aus dem reduziert wird; die PCA wird nur auf dem train-Split
  # angepasst. Diese Werte gehen in den Fingerabdruck ein -- wer pca_dim
  # aendert, entwertet die Datei korrekt.
  #
  # Whitening bewusst nur auf 512 Komponenten, nicht auf allen. Die Vermutung
  # dahinter: die kleinsten Eigenwerte sind bei 50.000 Stichproben Rauschen,
  # und Whitening teilt durch sie. Die zwei Ausnahmen (anyloc_pcaw4096,
  # eigenplaces_pcaw2048) zeigen, dass das Vorzeichen zur Vermutung passt --
  # den Mechanismus belegen sie nicht. Dafuer braeuchte es Shrinkage
  # (durch sqrt(lambda + eps * lambda_max) teilen); ungemessen.
  #
  # Die Bloecke teilen sich ihre Werte ueber YAML-Anker (_vorlagen unten);
  # <<: fuegt den Anker ein, source kommt je Variante dazu.

  clip_pca512:        {source: "clip",        <<: *pca512}
  anyloc_pca512:      {source: "anyloc",      <<: *pca512}
  mixvpr_pca512:      {source: "mixvpr",      <<: *pca512}
  eigenplaces_pca512: {source: "eigenplaces", <<: *pca512}
  megaloc_pca512:     {source: "megaloc",     <<: *pca512}

  clip_pcaw512:        {source: "clip",        <<: *pcaw512}
  anyloc_pcaw512:      {source: "anyloc",      <<: *pcaw512}
  mixvpr_pcaw512:      {source: "mixvpr",      <<: *pcaw512}
  eigenplaces_pcaw512: {source: "eigenplaces", <<: *pcaw512}
  megaloc_pcaw512:     {source: "megaloc",     <<: *pcaw512}

  anyloc_pcaw4096:      {source: "anyloc",      pca_dim: 4096, fit_images: 50000, whiten: true}
  eigenplaces_pcaw2048: {source: "eigenplaces", pca_dim: 2048, fit_images: 50000, whiten: true}

  # Verkettung: die Quellen muessen denselben Split haben, das Skript prueft
  # den Metadaten-Hash. Die Reihenfolge bestimmt die Reihenfolge der Bloecke.
  eigenplaces_megaloc_concat:
    sources: ["eigenplaces_pcaw512", "megaloc_pcaw512"]


  # ----------------------------------------------------------
  # Dataset Split
  # ----------------------------------------------------------

  split_seed: 42

  train_fraction: 0.70
  database_fraction: 0.15
  query_fraction: 0.15

  # Anteil der train-Sequenzen, der in 05 als Validierung zurueckgehalten
  # wird. Beeinflusst nur das Adaptertraining, nicht die Auswertung.
  val_fraction: 0.10


  # ----------------------------------------------------------
  # Geografische Definition
  # ----------------------------------------------------------

  # Database-Bild gilt als positives Beispiel,
  # wenn es höchstens diesen Abstand zum Query hat.

  positive_radius_m: 10.0

  # Bilder außerhalb dieses Radius gelten als Negative.
  #
  # Der Bereich zwischen positive_radius_m und
  # negative_radius_m kann später als "hard negative"
  # verwendet werden.
  #
  # Zugleich die Schwelle der Ground Truth: compare.py nimmt diesen Wert als
  # Standard fuer --threshold. Warum 25 und nicht 10 oder 50 -- die Schwelle
  # muss ueber dem GPS-Rauschen der Aufnahmen liegen, sonst misst der Recall
  # die Ortung der Kamera statt die Leistung des Encoders. Mapillary-Bilder
  # kommen ueberwiegend von Smartphones und Dashcams; deren Einzelmessung
  # streut im Stadtgebiet (Mehrwegeausbreitung an Hausfassaden) typisch 5 bis
  # 15 m, einzelne Punkte deutlich weiter. Bei 10 m zaehlte ein korrekt
  # wiedererkannter Ort je nach Rauschen mal als Treffer, mal nicht; bei 50 m
  # faengt die Schwelle bereits die Nachbarstrasse ein. 25 m liegt darueber
  # und unter der typischen Blocklaenge. retrieval.thresholds berichtet
  # daneben 5 / 10 / 50 / 100 m, damit die Wahl nachpruefbar bleibt.

  uncertain_radius_m: 25.0      # 10-25 m: weder positiv noch negativ

  # Hard Negatives MUESSEN oberhalb der Uncertain-Zone liegen,
  # sonst trainiert man gegen die eigene Evaluationsmetrik.
  hard_negative_min_m: 25.0
  hard_negative_max_m: 100.0
  
  # Zwei Bilder 5 m auseinander, die in entgegengesetzte Richtungen schauen,
  # haben keinen gemeinsamen Bildinhalt -- geometrisch aber "positiv".
  # Maximale zyklische Differenz von compass_angle fuer ein Positiv-Paar.
  max_heading_diff_deg: 90.0


  # ----------------------------------------------------------
  # Adapter Training
  # ----------------------------------------------------------

  # Ground-Truth-Radius der Validierungsmetrik in 05. Standardmaessig
  # derselbe Wert wie uncertain_radius_m, damit val Recall@1 mit der
  # entsprechenden Zeile in 07 vergleichbar bleibt.
  val_radius_m: 25.0


  # Batchgroesse beim Encodieren in 04. Beeinflusst nur Tempo und
  # Speicherbedarf, nicht das Ergebnis.
  embed_batch_size: 64


  # Obergrenze der in 04 encodierten Bilder -- nur zum Ausprobieren auf einem
  # kleinen Ausschnitt. null = alle. Ein Wert hier erzeugt Embeddings, die
  # NICHT zur Auswertung taugen; der Fingerabdruck haelt sie auseinander.
  max_images: null


  adapter_training:

    # Anzahl Triplets pro Batch
    batch_size: 64

    # Anzahl Trainingsdurchläufe
    epochs: 20

    # Lernrate
    learning_rate: 0.001

    # Abstandsmarge der Triplet Loss
    margin: 0.2

    # Negative Sampling
    hard_negative_probability: 0.75

    # Abbruch nach so vielen Epochen ohne Verbesserung von val Recall@1.
    # null = alle epochs durchlaufen. Gespeichert wird ohnehin die beste
    # Epoche, patience spart nur Zeit.
    patience: 3

    # Mindestzuwachs, der als Verbesserung zaehlt. Ohne Schwelle setzt
    # Rauschen den Zaehler staendig zurueck -- bei ~3.200 val-Queries
    # entspricht ein einzelner Treffer 0.0003.
    min_delta: 0.001

    # Obergrenze fuer Trainingspaare je Epoche.
    #   null = alle Paare verwenden
    max_pairs_per_epoch: null


# ============================================================
# Retrieval
# ============================================================

retrieval:

  # Aktuelle Retrieval-Implementierung
  method: "faiss"

  # Wieviele Nachbarn 06 je Query speichert. Begrenzt, was 07 auswerten
  # kann, und was fuer eine spaetere GPS-Aggregation zur Verfuegung steht.
  top_k: 50

  # Maximale geografische Distanz für Ground Truth
  # bei der Evaluation.
  thresholds: [5, 10, 25, 50, 100]

  # Bei welchen k Recall berichtet wird. Muss <= top_k bleiben.
  k_values: [1, 5, 10, 20]

  # Fuer die strengere Auswertung: ein Datenbanktreffer zaehlt nur, wenn er
  # von einem anderen Fotografen stammt oder so viele Tage entfernt liegt.
  min_days_apart: 180


# ============================================================
# Lokalisierung
# ============================================================

# Aus der Trefferliste von 06 eine Koordinate machen (08_localization).
localization:

  # Wieviele Treffer je Anfrage einfliessen. Muss <= retrieval.top_k sein.
  top_k: 10

  # DBSCAN: Nachbarschaftsradius und Mindestgroesse einer Gruppe.
  # eps entspricht dem uncertain_radius_m, damit "dieselbe Stelle" hier und
  # in der Auswertung dasselbe heisst.
  eps_m: 25.0
  min_samples: 2

  # Die Aggregationsverfahren (Schwerpunkt, Clustering, Snap, Gated) sind
  # gemessen und unterliegen Top-1; sie stehen in
  # experiments/localization_aggregation.py und lesen die Werte hier.

  # Fuer die Gated-Variante: Top-1 wird nur durch die staerkste Gruppe
  # ersetzt, wenn mindestens dieser Anteil der Treffer in ihr liegt.
  gate_share: 0.7

  # Cosinus-Werte liegen dicht beieinander (bei CLIP 0.89 bis 0.92), eine
  # direkte Gewichtung waere praktisch ein ungewichteter Mittelwert. Die
  # Temperatur spreizt sie: hoeher = staerker auf die besten Treffer.
  softmax_temperature: 50.0


# ============================================================
# Mapillary
# ============================================================

zoom: 14

# Getrennt, weil die beiden Stufen unterschiedliche Arbeit machen:
# Kachelverarbeitung ist CPU-gebunden, der Bilddownload wartet auf das Netz.
#   "auto" = min(16, 2 x CPU-Kerne)
tile_workers: "auto"
#   "auto" = 96
download_workers: "auto"

# Aufloesung der Mapillary-Thumbnails beim Download. Nicht zu verwechseln
# mit vpr.<verfahren>.image_size, das die Modelleingabe bestimmt.
download_image_size: 1024

# Wieviele Bilder fehlen duerfen, bevor 03 und 04 abbrechen.
#
# Ohne diese Schranke war das die stillste Fehlerquelle des Projekts: laeuft
# der Token mitten im Download ab, schreibt 03 eine lange Fehlerliste und
# gilt trotzdem als fertig; 04 filtert die fehlenden Bilder heraus, bildet
# den Fingerabdruck aus den GEFILTERTEN Metadaten -- er passt also -- und
# liefert einen sauber abgestempelten, unvollstaendigen Encoder. Die Warnung
# dazu ist ein print in einem Notebook, das run.py ohne Konsole ausfuehrt.
# Lieber ein Abbruch als eine Zahl, der niemand ansieht, dass sie falsch ist.
#
# 0.01 = bis zu 1 % darf fehlen (in Osnabrueck ist es 1 Bild von 332.868).
max_missing_images_frac: 0.01

# 03 prueft nach dem Download, ob die JPGs vollstaendig sind.
#   false = nur die in diesem Lauf geholten Bilder (Sekunden)
#   true  = der gesamte Bestand (bei 330k Dateien etliche Minuten)
verify_all_images: false

# Bilder liegen ausserhalb des Repos (50 GB je Stadt): image_root/<stadt>,
# der Stadtname als Slug aus city (osnabrueck, wuerzburg, ...). Daneben
# image_root/test fuer eigene Fotos (locate.py, Demo). Je Rechner anders:
# VPR_IMAGE_ROOT (oder VPR_IMAGE_PATH fuer den Stadtordner direkt) in der
# Umgebung setzen statt die versionierte Datei zu aendern.
image_root: "~/Downloads/mapillary"



# ============================================================
# OpenStreetMap / Overpass
# ============================================================

# Woher 01 Stadtgrenze, Strassennetz und Stadtteile holt. Nominatim
# (Geocoder) und Overpass (alles andere) sind oeffentliche, geteilte
# Dienste: Zeitueberschreitung, 429 und 504 sind dort Normalbetrieb, kein
# Programmfehler. 01 bricht deshalb an keiner dieser Stellen mehr ab -- der
# Datensatz (metadata.parquet, die Split-Listen) steht vorher fest, die
# Karten und die Stadtteiltabelle danach fallen im Zweifel aus.

osm:

  # Antworten landen unter cache/ und werden bei einer Wiederholung nicht
  # erneut geholt. cache/ ist gitignored -- ein frischer Klon faengt leer an
  # und stellt jede Abfrage genau einmal wirklich.

  # Endpunkt ohne /interpreter. Der Standard ist haeufig ausgelastet;
  # Spiegel mit meist kuerzeren Wartezeiten:
  #   https://overpass.kumi.systems/api
  #   https://overpass.private.coffee/api
  # Je Rechner ohne Aenderung an dieser Datei: VPR_OVERPASS_URL setzen.

  overpass_url: "https://overpass-api.de/api"


  # Zeitlimit je Abfrage, in Sekunden. Gilt fuer die HTTP-Anfrage und fuer
  # das [timeout:...], das osmnx in das Overpass-Skript schreibt.
  # osmnx-Standard ist 180; das Strassennetz einer ganzen Stadt liegt an
  # einem ausgelasteten Endpunkt darueber.

  timeout_s: 300


  # Vor jeder Abfrage den Serverstatus lesen und warten, bis ein Slot frei
  # ist. Langsamer, aber ohne die 429-Sperren, die sonst mitten im Lauf
  # kommen. Nur auf einem eigenen Overpass-Server abschaltbar.

  rate_limit: true


# ============================================================
# Stadtteil-Auswertung
# ============================================================

districts:

  # true  = Stadtteile berechnen und auswerten
  # false = Stadtteilberechnung komplett überspringen

  enabled: true


  # OSM-place-Tags, die als Stadtteil gelten

  place_tags:
    - suburb
    - quarter
    - neighbourhood


  # Kleine Flächen herausfiltern

  min_area_km2: 0.05


  # Administrative Ebenen, die geprüft werden.
  # Bei gleichwertigen Kandidaten gilt die Reihenfolge
  # als Präferenz.

  admin_levels:
    - 10
    - 9


  # Mindestanzahl an Stadtteilen,
  # damit eine Ebene als brauchbar gilt.

  min_districts_required: 3
