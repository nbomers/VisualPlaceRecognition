# Projektparameter — bewusst versioniert.

city: "Osnabrück, Germany"

# --- VPR ---------------------------------------------------------
vpr:

  # clip, anyloc, eigenplaces, mixvpr
  method: "clip"

  # Recommended:
  # "openai/clip-vit-base-patch32"
  # "dinov2"
  # "" 

  model: "openai/clip-vit-base-patch32"

  split_seed: 42
  train_fraction: 0.70
  database_fraction: 0.15
  query_fraction: 0.15

  # Geografische Definition von positiven/negativen Paaren
  positive_radius_m: 10.0
  negative_radius_m: 25.0


retrieval:
  method: "numpy"
  threshold: 25



# --- Mapillary Values ------------------------------------------------

zoom: 14
max_workers: "auto"
image_size: 1024
img_download_path: "~/Downloads/images"
dataset_folder: "../data"

# --- Stadtteil-Auswertung --------------------------------------------------
districts:
  # true  = Stadtteile berechnen und auswerten
  # false = Stadtteilberechnung komplett überspringen
  enabled: true

  # OSM-place-Tags, die als Stadtteil gelten
  place_tags: [suburb, quarter, neighbourhood]

  # Kleiner: filtert Mini-Artefakte aus OSM
  min_area_km2: 0.05

  # Ab welchem Flächenanteil gilt ein Gebiet als in einem anderen enthalten.
  # OSM führt oft Stadtteil UND Ortsteil darin — ohne diese Auflösung
  # würden Bilder doppelt gezählt.
  nesting_threshold: 0.7

  # Administrative Ebenen, die als Stadtteilgliederung geprüft werden.
  # Die Reihenfolge dient bei gleichwertigen Kandidaten als Präferenz.
  admin_levels: [10, 9]

  # Mindestanzahl an Stadtteilflächen, damit die Ebene als brauchbar gilt.
  min_districts_required: 3



# --- Verifikation gegen mapillary.com --------------------------------------
verification:
  # true  = konfigurierte Spots prüfen
  # false = komplette Spot-Verifikation überspringen
  enabled: true

  # Radius um jeden Verifikationspunkt
  radius_m: 400

  # https://nominatim.openstreetmap.org/ui/search.html?q=...
  spots:
    "Markt / Dom": [52.2799, 8.0442]
    "Neumarkt": [52.2740, 8.0470]
    "Hauptbahnhof": [52.2726, 8.0614]
    "Westerberg": [52.2830, 8.0230]
