# Conda-Umgebung fuer beide Rechner (Mac M1 Pro, CachyOS mit RTX 3070).
#
#   conda env create -f environment.yml
#   conda activate vpr
#
# Aufteilung nach Herkunft, nicht nach Belieben:
#   conda  -- alles mit kompilierten Abhaengigkeiten (faiss, GDAL hinter
#             geopandas, BLAS hinter numpy). Hier zickt pip am ehesten.
#   pip    -- torch und alles, was darauf aufbaut. Die pip-Wheels waehlen
#             CUDA auf Linux und MPS auf dem Mac von selbst; ueber conda
#             muesste man das je Plattform getrennt pflegen.
#
# Untere Grenzen statt fester Versionen, damit dieselbe Datei auf beiden
# Plattformen aufloest. Welche Kombination nachgemessen ist, steht im Kopf
# von requirements.txt; requirements.lock.txt haelt eine exakte Aufloesung
# fest, die nachweislich durchlief. Fuer ein exaktes conda-Abbild einer
# Maschine:
#   conda env export --no-builds > environment.lock.yml

name: vpr

channels:
  - conda-forge

dependencies:
  # 3.11 ist die aelteste Version, unter der die Testsuite hier durchlief.
  - python>=3.11

  # Rechnen
  - numpy>=2.0
  - pandas>=2.2
  - scipy>=1.13
  - scikit-learn>=1.4
  - pyarrow>=16.0
  - faiss-cpu>=1.9.0

  # Geodaten
  - geopandas>=1.0
  - shapely>=2.0.4
  - osmnx>=2.0
  - folium>=0.15

  # Notebooks und Ablauf
  - jupyterlab>=4.0
  - nbformat>=5.9
  - nbclient>=0.9
  # Entfernt Zellenausgaben beim Commit. Einmal je Rechner aktivieren:
  #   nbstripout --install --attributes .gitattributes
  - nbstripout>=0.7
  - ruff>=0.5
  - pytest>=8.0
  - matplotlib>=3.8
  - tqdm>=4.66
  - pyyaml>=6.0
  - requests>=2.31
  - pillow>=10.0
  - einops>=0.7

  - pip
  - pip:
      - torch>=2.2
      - torchvision>=0.17
      - transformers>=4.40
      - timm>=1.0
      - fast_pytorch_kmeans>=0.2
      - mapbox-vector-tile>=2.0
      - gdown>=5.0
      - huggingface_hub>=0.23
      # fuer experiments/geometric_verification.py; bringt kornia und opencv mit
      - git+https://github.com/cvg/LightGlue.git
