# Linter und Tests bei jedem Push. Kein Torch, keine Bilder, keine Embeddings:
# die Tests laufen auf synthetischen Daten und den versionierten JSONs.
name: check

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # test_code_version_... sucht die Commits, die in den
          # Ergebnis-JSONs stehen -- ein flacher Klon kennt sie nicht.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install ruff pytest numpy pandas pyyaml tqdm scipy scikit-learn pyarrow shapely pyproj geopandas
      - run: ruff check .
      - run: pytest tests/ -q
